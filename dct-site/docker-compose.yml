services:
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DCT_PORT:-8094}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  php:
    image: php:8.3-fpm-alpine
    restart: unless-stopped
    command: ["sh", "-c", "chown -R www-data:www-data /var/www/data && exec php-fpm"]
    environment:
      DCT_DATA_DIR: /var/www/data
    volumes:
      - ./:/var/www/html:ro
      - dct_lead_data:/var/www/data
      - ./php-production.ini:/usr/local/etc/php/conf.d/zz-dct-production.ini:ro

volumes:
  dct_lead_data:
